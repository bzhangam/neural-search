name: Dispatch Proof

# BRANCH version. This body differs from the one on `main` and additionally
# reads a branch-only file (.github/dispatch-proof/MARKER.txt) that does not
# exist on `main`. If a workflow_dispatch run against this branch prints the
# BRANCH marker and cats MARKER.txt successfully, it proves that dispatch
# executes the DISPATCHED BRANCH's workflow body + repo contents, even though
# the trigger was registered from `main`.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/SHA this run was dispatched against (informational only)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - name: Which version ran
        run: |
          echo "MARKER: dispatch-proof running the BRANCH version (ci/dispatch-proof)"
          echo "github.ref_name = ${{ github.ref_name }}"
          echo "github.sha      = ${{ github.sha }}"
          echo "inputs.ref      = ${{ github.event.inputs.ref }}"

      - name: Checkout the dispatched ref
        uses: actions/checkout@v4

      - name: Confirm branch-only file is present
        run: |
          echo "Reading .github/dispatch-proof/MARKER.txt (only present on the branch):"
          cat .github/dispatch-proof/MARKER.txt
